plugins {
    id 'com.android.application'
}
// Debug builds do not require the original publishing key. Keep it outside Git.
def keystorePropertiesFile = rootProject.file('../keystore/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseProperties = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword'].every {
    keystoreProperties.getProperty(it)
}
def releaseStoreFile = hasReleaseProperties ? file(keystoreProperties['storeFile']) : null
def hasReleaseKey = hasReleaseProperties && releaseStoreFile.isFile()
if (hasReleaseProperties && !hasReleaseKey) {
    logger.warn('Release keystore is unavailable; release artifacts will be unsigned.')
}
android {
    namespace = 'com.herak.bouldershare'
    compileSdk = 37
    defaultConfig {
        applicationId = 'com.herak.bouldershare'
        minSdk = 24
        targetSdk = 37
        versionCode = 8
        versionName = '1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    if (hasReleaseKey) {
        signingConfigs {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = releaseStoreFile
                storePassword = keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig = signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
